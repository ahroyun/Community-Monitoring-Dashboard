name: Alert Bot

on:
  workflow_run:
    workflows: ["Update community data"]
    types: [completed]
  workflow_dispatch:             # 수동 실행

concurrency:
  group: alert-bot
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run alert bot
        run: node scripts/alert-bot.js
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          LINE_GROUP_ID_UNDECEMBER: ${{ secrets.LINE_GROUP_ID_UNDECEMBER }}

      - name: Save seen list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alert-seen.json
          git diff --staged --quiet || git commit -m "chore: update alert-seen list [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --no-rebase -X ours origin main && git push && break
            echo "Push failed, retrying in 10s ($i/5)..."
            sleep 10
          done
