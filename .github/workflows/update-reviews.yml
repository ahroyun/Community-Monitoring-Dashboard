name: Update Store Reviews

on:
  schedule:
    - cron: '0 2 * * *'   # 매일 오전 11시 KST (UTC 02:00)
  workflow_dispatch:        # 수동 실행 가능

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install google-play-scraper

      - name: Fetch store reviews
        run: node scripts/fetch-reviews.js

      - name: Generate review summary
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-review-summary.js

      - name: Fetch patch notes
        run: node scripts/fetch-patches.js

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reviews.json review-summary.json patches.json
          git diff --staged --quiet || git commit -m "chore: update store reviews and patches"
          for i in 1 2 3 4 5; do
            git pull --no-rebase -X ours origin main && git push && break
            echo "Push failed, retrying in 10s ($i/5)..."
            sleep 10
          done
